name: Nightly hosts (tier 3)

# Tier 3 of the testing plan: real MCP hosts against the Phase 4 fixture.
# Nightly and non-blocking by design — a model-driven step can fail for
# reasons unrelated to the code (docs/testing-plan.md, Phase 5).
#
# Two hosts: goose backed by a local Ollama model (no API spend), and
# claude-code when the CLAUDE_CODE_OAUTH_TOKEN secret is configured (roughly
# $0.30 of model spend per headless run). Without the secret, the claude
# install step is skipped, the binary stays absent, and the claude rows
# skip — the job degrades to Ollama-only rather than failing.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: real MCP hosts (goose/Ollama + claude-code)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The suite drives the Phase 4 fixture from dist/.
      - run: yarn build
      - name: Install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b
      - name: Start ollama and pull the model
        run: |
          # The installer starts a systemd service running as the `ollama`
          # system user, whose model dir (/usr/share/ollama/.ollama) the cache
          # step above cannot restore into. Replace it with a server running
          # as the runner user, so models land in ~/.ollama/models — the
          # cached path — and the 2.5GB pull is a no-op on warm runs. The
          # backgrounded server persists across the job's later steps.
          sudo systemctl disable --now ollama 2>/dev/null || true
          nohup ollama serve >/dev/null 2>&1 &
          for _ in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
          ollama list >/dev/null
          ollama pull qwen3:4b
      - name: Install goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install claude-code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Skip the first-run onboarding wizard (theme picker), which would
          # otherwise precede the input box; the trust-folder dialog is the
          # test driver's job, this one is environment setup.
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
      - run: yarn test:hosts

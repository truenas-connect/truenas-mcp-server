name: Nightly hosts (tier 3)

# Tier 3 of the testing plan: real MCP hosts against the tier-2 fixture.
# Nightly and non-blocking by design — a model-driven step can fail for
# reasons unrelated to the code.
#
# Two hosts: goose backed by a local Ollama model (no API spend), and
# claude-code when one of its dedicated credential secrets is configured
# (pinned to haiku — a few cents of model spend per run). Without a secret,
# the claude install step is skipped, the binary stays absent, and the claude
# rows skip — the job degrades to Ollama-only rather than failing.
#
# The job runs on truenas-lab-large, a fresh machine per job: 16GB, no swap,
# 8 vCPU. The image is not assumed to ship Node.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      goose_model:
        description: >-
          Ollama tag for the goose host, including a namespaced tag
          (user/model:tag). Scheduled runs ignore this and stay on
          qwen3:4b-instruct. The tag has to fit the 75776 context this job
          sets: qwen3:1.7b's GGUF context is 40960, so the prompt does not
          fit. llama3.2:1b's is 131072 and its template calls tools.
        required: false
        default: qwen3:4b-instruct
        type: string

permissions:
  contents: read

jobs:
  hosts:
    name: real MCP hosts (goose/Ollama + claude-code)
    # The runner is registered under this label alone.
    runs-on: truenas-lab-large
    # Headroom for the worst case: six tests, each bounded by the suite's
    # 20-minute testTimeout and run strictly in sequence (fileParallelism:
    # false), plus ~6 minutes of setup — 6 x 20 + 6 = 126. The margin above
    # that exists so a slow run fails on a per-test diagnostic assertion,
    # never an opaque job-level kill with nothing to read. This number grows
    # with the test count: raise it alongside vitest.hosts.config.ts, whose
    # comment carries the per-test arithmetic. A healthy run finishes far
    # sooner.
    timeout-minutes: 140
    env:
      # Empty on a schedule, so the scheduled run stays on qwen3:4b-instruct.
      # A dispatch that clears the input does the same.
      GOOSE_MODEL: ${{ github.event.inputs.goose_model || 'qwen3:4b-instruct' }}
      # Gate only — step-level `if:` cannot reference secrets.* directly, and
      # hoisting the secret itself here would hand it to every step,
      # including the curl|bash installers. The real token goes only to the
      # test step below.
      # Any of three credentials enables the claude half. The first two are
      # dedicated to this workflow so it can be rotated or revoked without
      # touching PR review; the third is the org-wide token review already
      # uses, accepted last so the nightly is not dark while no dedicated
      # secret exists:
      #
      #   TEST_HOSTS_CLAUDE_API_KEY     Anthropic API key, per-token billing
      #   TEST_HOSTS_CLAUDE_OAUTH_TOKEN `claude setup-token`, subscription
      #   UX_CLAUDE_CODE_OAUTH_TOKEN    org secret, granted per repository
      #
      # Setting either dedicated secret still takes precedence, so the
      # independent-rotation property the first two exist for is intact —
      # what changed is only what happens when neither is set. The org secret
      # resolves to the empty string where the grant is missing rather than
      # failing, so this gate stays false there and claude-code skips exactly
      # as it does today.
      HAS_CLAUDE_AUTH: ${{ secrets.TEST_HOSTS_CLAUDE_API_KEY != '' || secrets.TEST_HOSTS_CLAUDE_OAUTH_TOKEN != '' || secrets.UX_CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # The image is not assumed to have Node. setup-node's yarn cache
      # shells out to `yarn --version`, and `corepack enable` with no
      # --install-directory writes its shims next to whichever corepack is
      # first on PATH. Install Node 22 first, enable corepack against that
      # copy, then restore the cache. A corepack already on PATH is left
      # alone: a root-owned /usr/bin/corepack fails here with EACCES.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The suite drives the tier-2 fixture from dist/.
      - run: yarn build
      - name: Install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache key
        id: model-key
        run: |
          # Validated before anything is written, so a tag that fails this
          # never reaches $GITHUB_OUTPUT. The expression language has no
          # replace(), and GitHub rejects the workflow file if one is used,
          # which would take the scheduled run down with the dispatch.
          # : and / both become -, so the default qwen3:4b-instruct keeps the
          # key ollama-qwen3-4b-instruct and a namespaced tag still produces a
          # key the cache accepts. / is allowed in the tag: it is not a quote.
          case "$GOOSE_MODEL" in
            ''|*[!A-Za-z0-9:._/-]*)
              echo "goose model must be an ollama tag" >&2
              exit 1
              ;;
          esac
          echo "goose model: $GOOSE_MODEL"
          echo "key=ollama-${GOOSE_MODEL//[:\/]/-}" >> "$GITHUB_OUTPUT"
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ${{ steps.model-key.outputs.key }}
      - name: Start ollama and pull the model
        run: |
          # The installer starts a systemd service running as the `ollama`
          # system user, whose model dir (/usr/share/ollama/.ollama) the cache
          # step above cannot restore into. Replace it with a server running
          # as the runner user, so models land in ~/.ollama/models — the
          # cached path — and the 2.5GB pull is a no-op on warm runs. The
          # backgrounded server persists across the job's later steps.
          sudo systemctl disable --now ollama 2>/dev/null || true
          # OLLAMA_CONTEXT_LENGTH, not a model swap: ollama defaults num_ctx to
          # 4096 whatever the model supports, and qwen3:4b-instruct natively
          # supports 262144 — so the 4096 was a server setting we never set,
          # not a limit of the model. At 41 tools the tools/list prompt was
          # 32892 tokens and 40960 (40×1024, the next multiple of 1024 above
          # that prompt plus ~8k of conversation) cleared it. The catalog is
          # now 75 tools. Nightly run 38215788171 measured the prompt at 66781
          # tokens against that window, and ollama rejected every goose
          # request: "request (66781 tokens) exceeds the available context
          # size (40960 tokens)". 66781 + 8000 = 74781; 75776 is 74×1024, the
          # same rounding, leaving 8995 tokens of conversation headroom.
          #
          # KV cache is allocated for the whole window up front. f16 is ollama's
          # default. qwen3:4b is 36 layers, 8 KV heads, head_dim 128, so a token
          # is 2*36*8*128*2 = 147456 bytes. That is 6.04GB at 40960 — the
          # "order of 6GB" the previous setting was costed at — and 11.2GB at
          # 75776. q8_0 is half of that, about 5.6GB at this window. The weight
          # blob this job pulls is 2.5GB, so llama-server with q8_0 is expected
          # around 8GB. OLLAMA_FLASH_ATTENTION=1 is set with the cache type:
          # quantized KV is only used when flash attention is on.
          #
          # On the 16GB GitHub-hosted runner, 11.2GB of f16 cache plus the
          # weights looked likely to OOM. Run 38430326157 checked the allocate:
          # this step, including the empty /api/generate, finished in 9 seconds
          # and the runner was not killed. Goose still made no tool call —
          # headless came back with empty output inside its watch, and both
          # interactive tests waited out their elicitation budget — and there
          # was no exceed_context_size 400. The prompt fits. What did not
          # finish is the CPU prefill of those ~66k tokens.
          #
          # The lab runner is that same 16GB, with no swap and 8 vCPU. With
          # the f16 cache, llama-server RSS was about 13.9GB, available memory
          # about 1.3GB, and CPU pinned at 800%. q8_0 is the memory fix for
          # that RSS: it leaves headroom on a 16GB machine with no swap. It
          # does not speed goose up. The CPU is already saturated, and a
          # smaller cache does not shrink the prefill. If the prefill still
          # does not finish inside the watch, the next move is the one
          # src/server.spec.ts already names: delete the guidance copies from
          # tool descriptions in mcp-base.
          #
          # The VM received a shutdown signal around 29 minutes in and became
          # unreachable at about 1770s of uptime. Just before that, about 15GB
          # was available and llama-server, vitest, and goose had already
          # exited. The shutdown is under investigation as a ~30-minute runner
          # lifetime limit in the lab pool or its provider.
          #
          # A model's own Modelfile num_ctx would take precedence over this and
          # silently keep 4096 (ollama/ollama#10829, where mistral-small3.1
          # pins it). Checked against the registry: qwen3:4b-instruct sets only
          # repeat_penalty/stop/temperature/top_k/top_p, no num_ctx — so the
          # variable applies. Qwen3-4B-Instruct-2507's max_position_embeddings
          # is 262144, so 75776 is inside the trained window. `ollama ps`
          # below records the context and the KV type that actually came up.
          #
          # GOOSE_MODEL is the dispatch input, defaulting to that same tag.
          # Re-checked before offering a smaller one (registry manifests and
          # the GGUF headers, not the library badge):
          #   qwen3:1.7b — params are the same five, no num_ctx, and the
          #     template does call tools. GGUF context_length is 40960, rope
          #     scaling is absent, rope freq base is 1e6. The ~67k prompt does
          #     not fit; a larger n_ctx would be past the positions the weights
          #     were trained on. It is also the thinking model, which is the
          #     variant this job already left.
          #   llama3.2:1b — the instruct q8_0 (digest baf6a787fdff). No params
          #     layer, so no num_ctx. GGUF context_length is 131072, which
          #     holds 75776. The template tells the model it has tool calling
          #     capabilities and renders a function-call JSON. 16 layers, 8 KV
          #     heads, head_dim 64: q8_0 KV at this window is about 1.2GB plus
          #     the 1.3GB weights, under the 4b figure above.
          # The 4b layer arithmetic above is the default model. A dispatch
          # does not change the window: the prompt is the same size.
          # The tag was checked in the cache-key step, which is what keeps a
          # quote out of the JSON below.
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_CONTEXT_LENGTH=75776 \
            nohup ollama serve >/dev/null 2>&1 &
          for _ in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
          ollama list >/dev/null
          ollama pull "$GOOSE_MODEL"
          # Load the model and record the context it came up with, so the log
          # says what was actually in force rather than what we asked for. Not
          # an assertion: the suite already reports an undersized window
          # precisely (the headless test fails in seconds quoting n_ctx), and a
          # guess at ollama's ps schema would be a new way to fail spuriously.
          # An empty prompt on /api/generate loads the model and returns —
          # it generates nothing. `ollama run` is deliberately avoided here:
          # with an empty argument it can drop into its interactive REPL and
          # hang the job waiting on a stdin that never arrives.
          # The cache-key step rejected anything outside the tag allowlist,
          # which includes a quote, so this JSON is the tag.
          curl -sS http://localhost:11434/api/generate \
            -d "{\"model\":\"$GOOSE_MODEL\",\"prompt\":\"\",\"keep_alive\":\"10m\"}" \
            >/dev/null || true
          ollama ps || true
      - name: Install goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install claude-code
        if: env.HAS_CLAUDE_AUTH == 'true'
        run: |
          # ~/.local/bin is already on GITHUB_PATH from the goose step.
          curl -fsSL https://claude.ai/install.sh | bash
          # Skip the first-run onboarding wizard (theme picker), which would
          # otherwise precede the input box. Per-folder trust cannot be seeded
          # here: the temp cwd does not exist until a test, and this file is
          # what that test merges hasTrustDialogAccepted into. A later step
          # that overwrites it would drop that trust.
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
      - name: Run host suite
        env:
          # adapters.ts reads this; unset, the suite stays on qwen3:4b-instruct
          # even when the pull step fetched something else.
          TNMCP_GOOSE_MODEL: ${{ env.GOOSE_MODEL }}
          # The real credentials reach this step and no other — the gate above
          # is a boolean precisely so the curl|bash installer steps never see
          # them. Same three, same precedence.
          API_KEY: ${{ secrets.TEST_HOSTS_CLAUDE_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.TEST_HOSTS_CLAUDE_OAUTH_TOKEN }}
          ORG_OAUTH_TOKEN: ${{ secrets.UX_CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Export exactly one credential so the CLI never sees an ambiguous
          # auth environment: prefer the API key, then this workflow's own
          # token, then the org one. The order matches the gate above, so a
          # repository that sets a dedicated secret gets it used rather than
          # silently falling through to the shared account.
          if [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY"
          elif [ -n "$OAUTH_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          elif [ -n "$ORG_OAUTH_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$ORG_OAUTH_TOKEN"
          fi
          # Say which adapters are expected to run, so a skip is visible in
          # the log rather than only in vitest's quiet down-arrow lines. A
          # skipped adapter reads as a pass in the summary, which is how
          # claude-code stayed dark across every green run before this.
          echo "goose: enabled ($TNMCP_GOOSE_MODEL)"
          echo "claude-code: ${HAS_CLAUDE_AUTH}"
          yarn test:hosts

name: Claude Review

# The review itself lives in iXsystems/ux-github-workflows, as
# claude-review.yml — the one built in truenas/api-client-ts (schema, rubric,
# threshold gate, thread history, stale banner), moved there so every caller
# shares it and a change to the rubric or the gate happens once.
#
# What moved out of this repo with the switch:
#   the inline claude-code-action review that used to live in this file
#   .github/workflows/check-team.yml -> check-member.yml there, called by it
#
# `.claude/review-prompt.md` stays here, and is what the shared workflow's
# `prompt-file` input points at by default. It says what to look for in *this*
# codebase; the shared rubric is appended after it and says how to grade and
# report what turns up. Do not put severity levels back in it — the gate
# scores the shared ones.
#
# Reports as `review / <job names in ux-github-workflows>` — two checks, since
# the shared workflow runs the write-access gate as a job of its own,
# replacing `check-team / Check Team Membership` and `review`. Branch
# protection matches those whole strings: any required-check setting still
# naming the old ones stays pending forever, and the PR is unmergeable with
# nothing red on it to explain why.
#
# TEMPORARY: pinned to the feat/review-gate-hardening branch until it merges —
# the workflow ref below and the tooling-ref input must always name the same
# ref (the workflow cannot derive its own ref, see its tooling-ref
# description).
#
# Also temporary is the check-member job below, working around a cross-ref
# gap that exists only for branch-pinned callers: the branch's claude-review
# gates on check-member's `is_writer` output, but pins check-member to
# @master, which does not have that output yet — so its own gate always
# skips the review. Until the branch merges (master then gains is_writer and
# the gap closes), we run the branch's check-member ourselves and pass
# require-write-access: false, which keeps the same don't-review-drive-by-PRs
# property with the same code.
#
# Once feat/review-gate-hardening merges: point the `uses:` at @master,
# delete the check-member job and the `needs:`/`if:` lines, and drop the
# whole `with:` block.

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  check-member:
    uses: iXsystems/ux-github-workflows/.github/workflows/check-member.yml@feat/review-gate-hardening
    permissions:
      contents: read

  review:
    needs: [check-member]
    if: needs.check-member.outputs.is_writer == 'true'
    uses: iXsystems/ux-github-workflows/.github/workflows/claude-review.yml@feat/review-gate-hardening
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      require-write-access: false
      tooling-ref: feat/review-gate-hardening
    secrets:
      anthropic-api-key: ${{ secrets.CLAUDE_API_KEY }}
